name: Release packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify package versions match the tag
        run: |
          node - <<'JS'
          const version = require('./package.json').version;
          for (const path of ['./packages/cli/package.json', './packages/vscode/package.json']) {
            if (require(path).version !== version) throw new Error('Package version mismatch');
          }
          if (process.env.GITHUB_REF !== `refs/tags/v${version}`) throw new Error('Run from the matching release tag');
          JS
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run package:extension
      - run: npm run package:cli
      - name: Gather release artifacts
        run: |
          mkdir dist
          cp packages/vscode/*.vsix buddy-voice-cli-*.tgz dist/
          shasum -a 256 dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
